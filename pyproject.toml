[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codexd"
version = "0.1.0.dev0"
description = "A durable single-user Discord bridge for the official Codex Python SDK"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "codexD contributors" }]
dependencies = [
  "aiohttp>=3.11,<4",
  "croniter>=6,<7",
  "discord.py>=2.6,<3",
  "jsonschema>=4.25,<5",
  "keyring>=25,<26",
  "markdown-it-py>=4,<5",
  "openai-codex>=0.144.4,<0.145",
  "Pillow>=11,<13",
  "platformdirs>=4,<5",
  "psutil>=6,<8",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-psutil>=6,<8",
]

[project.scripts]
codexd = "codexd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codexd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codexd"]
