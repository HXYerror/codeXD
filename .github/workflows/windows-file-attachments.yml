name: Windows file attachments

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Mypy
        run: python -m mypy
      - name: Run native Windows attachment and runtime tests
        run: >-
          python -m pytest -q
          tests/test_discord_attachment_ingestor.py
          tests/test_discord_file_integration.py
          tests/test_file_attachment_foundation.py
          tests/test_runtime_turns.py
          tests/test_sdk_contract.py
      - name: Run visible transcript regressions
        run: >-
          python -m pytest -q
          tests/test_storage_recovery.py::test_terminal_projection_persists_full_visible_assistant_transcript
          tests/test_storage_recovery.py::test_terminal_transcript_filters_partial_and_keeps_canonical_final_last
          tests/test_storage_recovery.py::test_terminal_transcript_appends_fallback_without_promoting_commentary
          tests/test_storage_recovery.py::test_legacy_phase_less_final_is_kept_once_and_moved_last
          tests/test_storage_recovery.py::test_local_terminal_preserves_completed_commentary_and_excludes_partial
          tests/test_discord_reliability.py::test_final_outbox_renders_visible_transcript_not_only_canonical_final
      - name: Run session status regressions
        run: >-
          python -m pytest -q
          tests/test_session_lifecycle.py::test_session_status_does_not_cold_start_runtime
          tests/test_session_lifecycle.py::test_session_status_model_source_precedence
          tests/test_session_lifecycle.py::test_session_status_resolves_sources_and_active_turn_drift
          tests/test_session_lifecycle.py::test_session_status_catalog_failure_degrades_without_failing
          tests/test_discord_bridge.py::test_every_registered_discord_command_executes_through_bridge
