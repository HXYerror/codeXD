name: Windows file attachments

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Mypy
        run: python -m mypy
      - name: Run the full native Windows test suite
        run: python -m pytest -q
