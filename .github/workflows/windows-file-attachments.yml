name: Windows file attachments

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Mypy
        run: python -m mypy
      - name: Run native Windows attachment and runtime tests
        run: >-
          python -m pytest -q
          tests/test_discord_attachment_ingestor.py
          tests/test_discord_file_integration.py
          tests/test_file_attachment_foundation.py
          tests/test_runtime_turns.py
          tests/test_sdk_contract.py
