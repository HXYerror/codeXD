name: SDK runtime contracts

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify paired dependency resolution
        run: python -c "import importlib.metadata as m; assert [m.version(n) for n in ('openai-codex', 'openai-codex-cli-bin')] == ['0.147.0', '0.147.0']"
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Full suite including real app-server with local SSE fixture
        run: python -m pytest -q
      - run: python -m build
